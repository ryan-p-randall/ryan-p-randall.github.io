# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
locale: "en-US"
title: "Ryan P. Randall"
title_separator: "—"
subtitle:
name: "Ryan P. Randall"
email:
description: >- # this means to ignore newlines until "baseurl:"
  "Ryan P. Randall's website"
url: "https://www.ryanpatrickrandall.com" # "https://ryan-p-randall.github.io" # 
baseurl: ""
repository: "ryan-p-randall/ryan-p-randall.github.io"
lifespan: 2014-2025
teaser:  
logo:  
masthead_title: 
og_image: /assets/images/pocket-notebooks-og-card.jpg
# breadcrumbs: true  
enable_copy_code_button: true
words_per_minute: 200  
date_format: "%Y-%m-%d"
comments:  
  provider: "giscus" # "utterances"
  giscus:
    repo_id           : "MDEwOlJlcG9zaXRvcnkyMzc1NDc4OA=="
    category_name     : "Comments"
    category_id       : "DIC_kwDOAWp4JM4CcAtG"
    discussion_term   : "pathname"
    reactions_enabled : "1"
    theme             : "preferred_color_scheme"
#    theme                : # "github-light" (default), "github-dark"
#    issue_term           : # "pathname" (default)
# twitter_username: foureyedsoul
github_username: ryan-p-randall
minimal_mistakes_skin: dark-citrus-sage
minimal_mistakes_skin_light: light-citrus-sage
# atom_feed:
feed:
  path                   : # blank (default) uses feed.xml
  categories:
    - semi-schematic
search                   : true # true, false (default)
search_full_content      : # true, false (default)
search_provider          : # lunr (default), algolia, google

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.27.3" # remote_theme: "mmistakes/minimal-mistakes"
kramdown:
  auto_ids: true
# Outputting
permalink: "/:categories/:title"
paginate: 5 # amount of posts to show
paginate_path: "page:num/"
timezone: America/Boise # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _sass
  - _pages
#  - _posts
#  - wiki
#  - _notes

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude:
  - _includes/notes_graph.json
  - package.json
  - src
  - node_modules
  - vendor/bundle

# Plugins (previously gems:)
plugins:
  - github-pages
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
#  - jekyll-webmention_io
#  - jekyll-algolia

author:
  name   : "Ryan P. Randall"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Instructional designer, tinkerer ∴ Cultural, information, literary, and media studies ∴ Another world is possible."
  location: "Boise, Idaho"
