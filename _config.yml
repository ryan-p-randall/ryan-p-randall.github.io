collections:
#  wiki:
#    output: true
#    permalink: /:collection/:path # /:slug # /wiki/:title
  notes:
    output: true
    permalink: /:collection/:path # /:slug
  bookmarks:
    output: true
    permalink: /:collection/:path
#  portfolio:
#    output: true
#    permalink: /:collection/:path
#  posts:
#    output: true

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single-custom-related-categories
      author_profile: false # true
      breadcrumbs: true
      comments: true
      read_time: false
      related: true
      share: false
      show_date: true
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false # true
      breadcrumbs: true
      toc_sticky: true
      feedback: false # true
  # notes  
  - scope:
      path: "" # "_notes/**/*.md"
      type: notes
    values:
      layout: note
      author_profile: false # true
      comments: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "notes"
  # bookmarks 
  - scope:
      path: "" # "_notes/**/*.md"
      type: bookmarks
    values:
      layout: bookmark-single-page # single
      breadcrumbs: true
      # toc: false # true
      # toc_sticky: false # true
      author_profile: false # true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# scripts

