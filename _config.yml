# preferences:
#  backlinks:
#    enabled: true
#  wiki_style_link: # This property handles wiki style links '[['
#    enabled: true
#  pagepreview:
#    enabled: true

after_footer_scripts:
    - /assets/js/plugins/external-link-indicator.js

webmentions:
  username: www.ryanpatrickrandall.com
  pages: true
  collections:
    - notes
  templates:
    bookmarks: _includes/webmentions-bookmarks-custom.html
    likes: _includes/webmentions-likes-custom.html
    reposts: _includes/webmentions-reposts-custom.html
  throttle_lookups:
#    last_week: daily
    last_month: weekly
    last_year: every 2 weeks
    older: monthly
  max_attempts: 5
  cache_bad_uris_for: 5
  bad_uri_policy:
    unsupported:
      policy: ban
    error:
      policy: ignore
    failure:
      policy: retry
      retry_delay: [ 1, 12, 48, 120 ]
      max_retries: 5